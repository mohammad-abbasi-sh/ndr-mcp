[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ndr-mcp"
version = "0.1.0"
description = "Unofficial read-only MCP server for NDR — headlines, regional news, sections, keyword search and article text via the official RSS feeds"
readme = "README.md"
license = { text = "PolyForm-Noncommercial-1.0.0" }
requires-python = ">=3.10"
dependencies = [
    "mcp<2",
    "httpx>=0.27",
]
authors = [{ name = "Mohammad Abbasi" }]

[project.scripts]
ndr-mcp = "ndr_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ndr_mcp"]

[tool.pytest.ini_options]
markers = ["live: tests that hit the real www.ndr.de/feeds/latest.rss feeds"]
